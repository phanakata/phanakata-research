---
layout: default
---
<div class="post-hero" {% if page.image %} style="background-image: url('{{ page.image | prepend: site.baseurl }}');" {% endif %}>
  <div class="post-hero-overlay">
    <div class="container">
      <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.author %} &middot; {{ page.author }}{% endif %}{% if page.categories %} &middot; {% for cat in page.categories %}{{ cat }}{% unless forloop.last %}, {% endunless %}{% endfor %}{% endif %}</p>
      <h1>{{ page.title }}</h1>
    </div>
  </div>
</div>

<div class="container post-body">
  <article>
    {{ content }}
  </article>
  <div class="post-back">
    <a href="{{ '/' | prepend: site.baseurl }}">&larr; Back to research</a>
  </div>
</div>
