<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title and page.title != "" %}{{ page.title }} — {% endif %}Paul Hanakata</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/css/main.css' | prepend: site.baseurl }}" />
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$','$'],['\\(','\\)']],
        displayMath: [['$$','$$'],['\\[','\\]']]
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

<header>
  <div class="container nav-container">
    <a class="site-title" href="{{ '/' | prepend: site.baseurl }}">Paul Hanakata</a>
    <nav>
      <a href="{{ site.baseurl }}/CV/">CV</a>
      <a href="{{ site.baseurl }}/Publications/">Publications</a>
      <a href="{{ site.baseurl }}/Codes/">Codes</a>
      <a href="{{ site.baseurl }}/Courses/">Courses</a>
    </nav>
  </div>
</header>

<main>
  {{ content }}
</main>

<footer>
  <div class="container">
    <span>Paul Hanakata &middot; Physics Department, Harvard University</span>
    <span class="footer-sep">&middot;</span>
    <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub</a>
    <span class="footer-sep">&middot;</span>
    <a href="https://www.linkedin.com/in/{{ site.linkedin_id }}" target="_blank" rel="noopener">LinkedIn</a>
    <span class="footer-sep">&middot;</span>
    <a href="https://www.researchgate.net/profile/{{ site.researchgate_id }}" target="_blank" rel="noopener">ResearchGate</a>
  </div>
</footer>

</body>
</html>
